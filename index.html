<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B2A20">
<meta name="description" content="AquaSense — a solar-powered IoT water quality monitoring dashboard for Barangay Ibaba West, Calapan City, Oriental Mindoro.">
<title>AquaSense | Live Water Quality Monitor</title>

<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root{
  /* Brand greens */
  --green-950:#14211A;
  --green-900:#1B2A20;
  --green-850:#24352A;
  --green-800:#344E3D;
  --green-700:#3F5C49;
  --green-600:#526F5B;
  --green-500:#71866D;
  --green-400:#879B83;
  --green-300:#A6B8A0;
  --green-200:#C8D2C0;
  --green-100:#E3E7DB;

  /* Neutrals / sand */
  --sand-50:#F7F8F2;
  --sand-100:#F0F1E9;
  --sand-200:#E6E8DD;

  --ink:#24352A;
  --muted:#647468;
  --line:#DCE0D5;
  --card:#FFFFFF;

  /* Semantic (light) */
  --ok:#2E8B62;
  --warn:#B3781F;
  --bad:#C0453D;

  /* Semantic (dark) */
  --ok-lt:#4FE0AC;
  --warn-lt:#F0C878;
  --bad-lt:#F0928C;

  /* Water accent */
  --aqua:#4FD1B0;
  --aqua-dim:rgba(79,209,176,.28);

  /* Chart accents */
  --c-ph:#526F5B;
  --c-turb:#8A7A4E;
  --c-temp:#A9603F;

  /* Shape */
  --r-sm:10px;
  --r-md:16px;
  --r-lg:22px;
  --r-xl:30px;
  --r-full:999px;

  /* Elevation */
  --sh-xs:0 1px 2px rgba(27,42,32,.06);
  --sh-sm:0 2px 6px rgba(27,42,32,.06), 0 1px 2px rgba(27,42,32,.04);
  --sh-md:0 18px 40px -20px rgba(27,42,32,.45);
  --sh-lg:0 36px 70px -34px rgba(27,42,32,.6);

  /* Layout */
  --nav-h:66px;
  --container:1280px;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);

  /* Type */
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}

/* ============================================================
   2. RESET & BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}

html{
  -webkit-text-size-adjust:100%;
  scroll-padding-top:calc(var(--nav-h) + 16px);
}

body{
  margin:0;
  font-family:var(--font-sans);
  font-size:15px;
  line-height:1.65;
  color:var(--ink);
  background:var(--sand-100);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

h1,h2,h3,h4,p,ul,ol,figure,blockquote{margin:0;}
ul,ol{padding:0;list-style:none;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
canvas{display:block;}

:focus-visible{
  outline:2px solid var(--aqua);
  outline-offset:3px;
  border-radius:6px;
}

.container{
  width:100%;
  max-width:var(--container);
  margin-inline:auto;
  padding-inline:clamp(14px,4vw,40px);
}

.visually-hidden{
  position:absolute!important;
  width:1px;height:1px;
  padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);
  white-space:nowrap;border:0;
}

/* Rising-bubble canvas layer */
#bubbleLayer{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}

header,main,footer{position:relative;z-index:1;}

/* Click ripple */
.click-ripple{
  position:fixed;
  width:14px;height:14px;
  margin:-7px 0 0 -7px;
  border-radius:50%;
  border:2px solid var(--aqua);
  pointer-events:none;
  z-index:9999;
  animation:rippleOut .85s var(--ease-out) forwards;
}
@keyframes rippleOut{
  0%{transform:scale(.35);opacity:.9;}
  100%{transform:scale(13);opacity:0;}
}

/* Swim-away easter egg */
.fish{
  position:fixed;
  bottom:8vh;
  left:-14vw;
  font-size:clamp(30px,5vw,52px);
  z-index:9998;
  pointer-events:none;
  animation:swim 6.5s linear forwards;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.25));
}
@keyframes swim{
  0%{transform:translate(0,0) scaleX(-1);opacity:0;}
  8%{opacity:1;}
  50%{transform:translate(65vw,-6vh) scaleX(-1);}
  92%{opacity:1;}
  100%{transform:translate(130vw,4vh) scaleX(-1);opacity:0;}
}

/* Scroll reveal utility */
[data-reveal]{
  opacity:0;
  transform:translateY(20px);
  transition:opacity .65s var(--ease-out), transform .65s var(--ease-out);
  will-change:opacity,transform;
}
[data-reveal].is-in{opacity:1;transform:none;}

/* ============================================================
   3. HEADER / NAVIGATION
   ============================================================ */
.site-header{
  position:sticky;
  top:0;
  z-index:200;
  background:rgba(20,33,26,.82);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  backdrop-filter:blur(18px) saturate(150%);
  border-bottom:1px solid rgba(255,255,255,.09);
  color:#fff;
}

.nav{
  display:flex;
  align-items:center;
  gap:14px;
  height:var(--nav-h);
}

/* Brand */
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  flex:0 0 auto;
  border-radius:var(--r-md);
  padding:4px 6px 4px 4px;
}
.brand__mark{
  width:40px;height:40px;
  display:grid;place-items:center;
  border-radius:13px;
  background:linear-gradient(150deg,rgba(79,209,176,.35),rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.22);
  color:#fff;
  flex:0 0 auto;
  transition:transform .3s var(--ease-out), box-shadow .3s var(--ease-out);
  box-shadow:0 0 0 0 var(--aqua-dim);
}
.brand:hover .brand__mark{
  transform:rotate(-8deg) scale(1.06);
  box-shadow:0 0 0 6px var(--aqua-dim);
}
.brand__text{line-height:1.1;}
.brand__name{
  display:block;
  font-size:19px;
  font-weight:800;
  letter-spacing:-.4px;
  color:#fff;
}
.brand__name span{color:var(--green-200);}
.brand__tag{
  display:block;
  font-size:8px;
  font-weight:600;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);
  margin-top:3px;
}

/* Nav links */
.nav__links{
  position:relative;
  display:flex;
  align-items:center;
  gap:2px;
  margin-left:auto;
}
.nav__indicator{
  position:absolute;
  top:50%;
  left:0;
  height:36px;
  margin-top:-18px;
  width:0;
  border-radius:var(--r-full);
  background:rgba(255,255,255,.14);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);
  transition:transform .38s var(--ease-out), width .38s var(--ease-out);
  z-index:0;
  pointer-events:none;
}
.nav__link{
  position:relative;
  z-index:1;
  display:block;
  padding:9px 14px;
  border-radius:var(--r-full);
  font-size:13.5px;
  font-weight:600;
  letter-spacing:.1px;
  color:rgba(255,255,255,.74);
  white-space:nowrap;
  transition:color .2s var(--ease);
}
.nav__link:hover{color:#fff;}
.nav__link.is-active{color:#fff;}

/* Live status pill */
.nav__status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 13px 6px 11px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r-full);
  background:rgba(255,255,255,.06);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.2px;
  color:rgba(255,255,255,.86);
  white-space:nowrap;
  flex:0 0 auto;
}

.dot{
  width:8px;height:8px;
  border-radius:50%;
  flex:0 0 auto;
  background:#E0B354;
  box-shadow:0 0 0 3px rgba(224,179,84,.22);
  transition:background .25s var(--ease), box-shadow .25s var(--ease);
}
.dot.is-live{
  background:#3BD69B;
  box-shadow:0 0 0 3px rgba(59,214,155,.22);
  animation:pulse 2.2s var(--ease) infinite;
}
.dot.is-offline{
  background:#E4675F;
  box-shadow:0 0 0 3px rgba(228,103,95,.22);
  animation:none;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 3px rgba(59,214,155,.22);}
  50%{box-shadow:0 0 0 7px rgba(59,214,155,.04);}
}

/* Hamburger */
.nav__toggle{
  display:none;
  flex-direction:column;
  justify-content:center;
  gap:4px;
  width:42px;height:40px;
  padding:0 10px;
  border:1px solid rgba(255,255,255,.24);
  border-radius:12px;
  flex:0 0 auto;
  transition:background .18s var(--ease);
}
.nav__toggle:hover{background:rgba(255,255,255,.10);}
.nav__toggle span{
  display:block;
  height:2px;
  border-radius:2px;
  background:#fff;
  transition:transform .28s var(--ease), opacity .2s var(--ease);
}
.nav__toggle.is-open span:nth-child(1){transform:translateY(6px) rotate(45deg);}
.nav__toggle.is-open span:nth-child(2){opacity:0;}
.nav__toggle.is-open span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}

/* ============================================================
   4. HERO
   ============================================================ */
.hero{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  color:#fff;
  background:
    radial-gradient(120% 90% at 15% 0%, #2C4436 0%, transparent 60%),
    linear-gradient(160deg, #1B2A20 0%, #2C4436 34%, #3F5C49 62%, #24352A 100%);
  padding-top:clamp(30px,5vw,58px);
  padding-bottom:230px;
}

.hero__glow{
  position:absolute;
  border-radius:50%;
  filter:blur(70px);
  pointer-events:none;
  z-index:-1;
}
.hero__glow--1{
  width:560px;height:560px;
  top:-200px;right:-140px;
  background:radial-gradient(circle,rgba(79,209,176,.30),transparent 68%);
  animation:floaty 14s ease-in-out infinite;
}
.hero__glow--2{
  width:460px;height:460px;
  bottom:-160px;left:-160px;
  background:radial-gradient(circle,rgba(200,210,192,.20),transparent 68%);
  animation:floaty 19s ease-in-out infinite reverse;
}
@keyframes floaty{
  0%,100%{transform:translate3d(0,0,0) scale(1);}
  50%{transform:translate3d(-24px,26px,0) scale(1.08);}
}

/* subtle tech grid */
.hero__grid{
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 10%, #000 20%, transparent 80%);
  mask-image:radial-gradient(ellipse 90% 70% at 50% 10%, #000 20%, transparent 80%);
}

.hero__inner{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(300px,370px);
  align-items:center;
  gap:clamp(24px,4vw,56px);
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:6px 14px 6px 11px;
  border-radius:var(--r-full);
  border:1px solid rgba(255,255,255,.20);
  background:rgba(255,255,255,.08);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:rgba(255,255,255,.9);
}
.eyebrow__dot{
  width:6px;height:6px;border-radius:50%;
  background:#3BD69B;
  box-shadow:0 0 0 3px rgba(59,214,155,.22);
  animation:pulse 2.2s var(--ease) infinite;
}

.hero__title{
  margin:18px 0 12px;
  font-size:clamp(2.9rem,7vw,5rem);
  font-weight:900;
  letter-spacing:-.04em;
  line-height:.94;
  color:#fff;
}
.hero__title span{
  background:linear-gradient(110deg,var(--green-200) 0%,var(--aqua) 45%,var(--green-100) 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  animation:shimmer 7s linear infinite;
}
@keyframes shimmer{to{background-position:220% 0;}}

.hero__subtitle{
  font-size:clamp(15px,1.6vw,18px);
  font-weight:700;
  line-height:1.4;
  color:#fff;
  margin-bottom:10px;
}
.hero__text{
  max-width:58ch;
  font-size:13.5px;
  line-height:1.78;
  color:rgba(255,255,255,.78);
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:20px 0 26px;
}
.chips li{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 13px;
  border-radius:var(--r-full);
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);
  font-size:11px;
  font-weight:600;
  color:rgba(255,255,255,.88);
  white-space:nowrap;
  transition:transform .25s var(--ease-out), background .25s, border-color .25s;
}
.chips li::before{
  content:"";
  width:5px;height:5px;border-radius:50%;
  background:var(--aqua);
  box-shadow:0 0 8px var(--aqua);
}
.chips li:hover{
  transform:translateY(-3px);
  background:rgba(79,209,176,.16);
  border-color:rgba(79,209,176,.5);
}

.hero__actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
}

.btn{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:13px 24px;
  border-radius:var(--r-full);
  font-size:13.5px;
  font-weight:700;
  letter-spacing:.1px;
  transition:transform .25s var(--ease-out), box-shadow .25s var(--ease-out),
             background-color .2s var(--ease), border-color .2s var(--ease);
  will-change:transform;
}
.btn--primary{
  background:linear-gradient(135deg,var(--green-800),var(--green-700));
  color:#fff;
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 14px 30px -14px rgba(0,0,0,.8);
}
.btn--primary:hover{
  box-shadow:0 20px 38px -16px rgba(0,0,0,.9), 0 0 0 6px rgba(79,209,176,.14);
}
.btn--ghost{
  color:#fff;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.05);
}
.btn--ghost:hover{
  background:rgba(79,209,176,.16);
  border-color:rgba(79,209,176,.55);
}
.btn__arrow{transition:transform .25s var(--ease-out);}
.btn:hover .btn__arrow{transform:translateX(4px);}

/* ---- Live card ---- */
.live-card{
  position:relative;
  padding:20px 18px 16px;
  border-radius:var(--r-lg);
  border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(160deg,rgba(63,92,73,.88) 0%,rgba(27,42,32,.94) 100%);
  box-shadow:var(--sh-lg);
  -webkit-backdrop-filter:blur(16px) saturate(130%);
  backdrop-filter:blur(16px) saturate(130%);
  overflow:hidden;
  transition:transform .3s var(--ease-out), box-shadow .3s var(--ease-out);
  will-change:transform;
  animation:cardIn .9s var(--ease-out) both .15s;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(26px) scale(.96);}
  to{opacity:1;transform:none;}
}
.live-card::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.10) 46%,transparent 60%);
  background-size:260% 100%;
  animation:sweep 8s ease-in-out infinite;
}
@keyframes sweep{
  0%{background-position:170% 0;}
  55%,100%{background-position:-90% 0;}
}

.live-card__head{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding-bottom:12px;
  border-bottom:1px solid rgba(255,255,255,.14);
}
.live-card__title{
  font-size:10.5px;
  font-weight:800;
  letter-spacing:1.3px;
  text-transform:uppercase;
  color:#fff;
}
.live-card__tag{
  font-size:9px;
  font-weight:800;
  letter-spacing:1px;
  padding:4px 9px;
  border-radius:var(--r-full);
  background:rgba(224,179,84,.14);
  color:var(--warn-lt);
  white-space:nowrap;
  transition:color .25s, background-color .25s;
}
.live-card__tag.is-live{background:rgba(59,214,155,.16);color:var(--ok-lt);}
.live-card__tag.is-offline{background:rgba(228,103,95,.18);color:var(--bad-lt);}

.readings{position:relative;z-index:1;}
.reading{
  display:grid;
  grid-template-columns:26px minmax(0,1fr) auto;
  grid-template-areas:
    "icon name value"
    "icon status value";
  align-items:center;
  column-gap:10px;
  padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.09);
}
.reading:last-child{border-bottom:0;}

.reading__icon{
  grid-area:icon;
  width:26px;height:26px;
  display:grid;place-items:center;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.24);
  font-size:11px;
  color:rgba(255,255,255,.88);
  flex:0 0 auto;
}
.reading__name{
  grid-area:name;
  font-size:12.5px;
  color:rgba(255,255,255,.82);
  line-height:1.2;
}
.reading__value{
  grid-area:value;
  font-family:var(--font-mono);
  font-size:14.5px;
  font-weight:600;
  color:#fff;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.2px;
}
.reading__value .unit{
  font-size:.72em;
  font-weight:500;
  opacity:.6;
  margin-left:3px;
  font-family:var(--font-sans);
}
.reading__status{
  grid-area:status;
  font-size:9.5px;
  font-weight:600;
  letter-spacing:.3px;
  line-height:1.3;
  color:rgba(255,255,255,.55);
}

.reading__status.txt-ok,.live-card .txt-ok{color:var(--ok-lt);}
.reading__status.txt-warn,.live-card .txt-warn{color:var(--warn-lt);}
.reading__status.txt-bad,.live-card .txt-bad{color:var(--bad-lt);}

.live-card__foot{
  position:relative;
  z-index:1;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,.09);
  font-size:10px;
  line-height:1.55;
  color:rgba(255,255,255,.48);
}
.live-card__foot b{color:rgba(255,255,255,.72);font-weight:600;}

/* ---- Floating buoy (prototype reference) ---- */
.buoy{
  position:absolute;
  right:12%;
  bottom:34px;
  width:150px;
  z-index:2;
  pointer-events:none;
  filter:drop-shadow(0 22px 26px rgba(0,0,0,.45));
}
.buoy__bob{animation:bob 5.5s ease-in-out infinite;}
@keyframes bob{
  0%,100%{transform:translateY(0) rotate(-1.6deg);}
  50%{transform:translateY(-11px) rotate(1.6deg);}
}
.buoy__signal circle{
  transform-box:fill-box;
  transform-origin:center;
  animation:ping 2.6s var(--ease-out) infinite;
}
@keyframes ping{
  0%{transform:scale(.55);opacity:.9;}
  75%,100%{transform:scale(2.8);opacity:0;}
}
.buoy__led{animation:ledPulse 1.8s ease-in-out infinite;transition:fill .5s var(--ease);}
@keyframes ledPulse{
  0%,100%{opacity:1;}
  50%{opacity:.32;}
}
.buoy[data-status="warn"] .buoy__led{fill:var(--warn-lt);}
.buoy[data-status="bad"]  .buoy__led{fill:var(--bad-lt);}
.buoy[data-status="ok"]   .buoy__led{fill:var(--ok-lt);}

/* ---- Waves ---- */
.hero__waves{
  position:absolute;
  left:0;right:0;bottom:0;
  height:170px;
  overflow:hidden;
  pointer-events:none;
  z-index:1;
}
.waves{
  position:absolute;
  bottom:0;left:0;
  width:200%;
  height:100%;
}
.waves--back{animation:waveDrift 30s linear infinite;opacity:.5;}
.waves--mid{animation:waveDrift 22s linear infinite reverse;opacity:.72;}
.waves--front{animation:waveDrift 15s linear infinite;opacity:1;}
@keyframes waveDrift{to{transform:translateX(-50%);}}

/* ============================================================
   5. TICKER
   ============================================================ */
.ticker{
  overflow:hidden;
  background:var(--sand-50);
  border-block:1px solid var(--line);
  position:relative;
  z-index:1;
}
.ticker__track{
  display:flex;
  width:max-content;
  animation:marquee 34s linear infinite;
}
.ticker:hover .ticker__track{animation-play-state:paused;}
@keyframes marquee{to{transform:translateX(-50%);}}
.ticker__group{
  display:flex;
  align-items:center;
  gap:26px;
  padding:11px 13px;
}
.ticker__group span{
  font-size:10.5px;
  font-weight:800;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--green-600);
  white-space:nowrap;
}
.ticker__group i{
  font-style:normal;
  font-size:7px;
  color:var(--aqua);
}

/* ============================================================
   6. MAIN / PANELS
   ============================================================ */
main{
  padding-block:clamp(22px,3.4vw,40px) 56px;
}

.tab-panel{display:none;}
.tab-panel.is-active{display:block;}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-sm);
  padding:clamp(18px,2.6vw,30px);
  animation:panelIn .55s var(--ease-out) both;
}
@keyframes panelIn{
  from{opacity:0;transform:translateY(18px) scale(.995);}
  to{opacity:1;transform:none;}
}

.section-head{
  display:flex;
  align-items:center;
  gap:14px;
  padding-bottom:16px;
  margin-bottom:clamp(18px,2.4vw,26px);
  border-bottom:1px solid var(--line);
}
.section-head__num{
  width:40px;height:40px;
  flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:13px;
  background:linear-gradient(150deg,var(--green-700),var(--green-900));
  color:#fff;
  font-size:14px;
  font-weight:800;
  font-family:var(--font-mono);
  box-shadow:0 8px 18px -10px rgba(27,42,32,.95);
  transition:transform .4s var(--ease-out);
}
.card:hover .section-head__num{transform:rotate(-8deg) scale(1.05);}
.section-head__title{
  font-size:clamp(15px,1.7vw,18px);
  font-weight:800;
  letter-spacing:.6px;
  text-transform:uppercase;
  color:var(--green-800);
  line-height:1.2;
}
.section-head__sub{
  display:block;
  margin-top:3px;
  font-size:11.5px;
  font-weight:500;
  letter-spacing:0;
  text-transform:none;
  color:var(--muted);
}

.prose p{
  font-size:13.5px;
  line-height:1.8;
  color:var(--ink);
  margin-bottom:14px;
}
.prose p:last-child{margin-bottom:0;}
.prose strong{color:var(--green-800);font-weight:700;}

/* ============================================================
   7. HOME — PILLARS & FLOW
   ============================================================ */
.pillars{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}
.pillar{
  position:relative;
  overflow:hidden;
  padding:22px 20px;
  border-radius:var(--r-lg);
  border:1px solid var(--line);
  background:linear-gradient(160deg,#fff,var(--sand-50));
  transition:transform .35s var(--ease-out), box-shadow .35s var(--ease-out), border-color .35s;
}
.pillar:hover{
  transform:translateY(-7px);
  box-shadow:var(--sh-md);
  border-color:var(--green-300);
}
.pillar::after{
  content:"";
  position:absolute;
  right:-50px;bottom:-70px;
  width:170px;height:170px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(79,209,176,.22),transparent 70%);
  opacity:0;
  transition:opacity .45s var(--ease);
}
.pillar:hover::after{opacity:1;}
.pillar__icon{
  width:48px;height:48px;
  display:grid;place-items:center;
  border-radius:15px;
  background:var(--green-100);
  color:var(--green-700);
  font-size:21px;
  margin-bottom:14px;
  transition:transform .35s var(--ease-out), background .35s, color .35s;
}
.pillar:hover .pillar__icon{
  transform:rotate(-9deg) scale(1.1);
  background:linear-gradient(150deg,var(--green-700),var(--green-900));
  color:#fff;
}
.pillar h3{
  font-size:14px;
  font-weight:800;
  color:var(--green-800);
  margin-bottom:6px;
}
.pillar p{
  font-size:12.5px;
  line-height:1.7;
  color:var(--muted);
}

.flow{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-top:22px;
}
.flow__step{
  position:relative;
  padding:16px 14px;
  border-radius:var(--r-md);
  background:var(--sand-100);
  border:1px solid var(--line);
  text-align:center;
  transition:transform .3s var(--ease-out), background .3s, border-color .3s;
}
.flow__step:hover{
  transform:translateY(-5px);
  background:#fff;
  border-color:var(--green-300);
}
.flow__step::after{
  content:"→";
  position:absolute;
  right:-13px;top:50%;
  transform:translateY(-50%);
  font-size:13px;
  color:var(--green-400);
  z-index:2;
}
.flow__step:last-child::after{display:none;}
.flow__step b{
  display:block;
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:1.4px;
  color:var(--green-500);
  margin-bottom:6px;
}
.flow__step strong{
  display:block;
  font-size:12.5px;
  font-weight:800;
  color:var(--green-800);
  margin-bottom:4px;
}
.flow__step small{
  display:block;
  font-size:10.5px;
  line-height:1.55;
  color:var(--muted);
}

/* ============================================================
   8. INTRODUCTION
   ============================================================ */
.intro{
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);
  gap:clamp(20px,3vw,32px);
  align-items:start;
}

.context{
  background:var(--sand-100);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:clamp(16px,2vw,20px);
}
.context__title{
  font-size:10.5px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color:var(--green-700);
  margin-bottom:8px;
}
.context__row{
  display:flex;
  gap:12px;
  padding:12px 10px;
  border-radius:var(--r-sm);
  border-bottom:1px dashed var(--line);
  transition:background .25s var(--ease), transform .25s var(--ease-out);
}
.context__row:last-of-type{border-bottom:0;}
.context__row:hover{background:#fff;transform:translateX(3px);}
.context__symbol{
  width:32px;height:32px;
  flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:10px;
  background:#fff;
  border:1px solid var(--line);
  color:var(--green-700);
  font-size:14px;
  transition:transform .3s var(--ease-out), background .3s, color .3s;
}
.context__row:hover .context__symbol{
  transform:rotate(-10deg) scale(1.08);
  background:var(--green-800);
  color:#fff;
}
.context__row strong{
  display:block;
  font-size:11.5px;
  font-weight:800;
  letter-spacing:.5px;
  text-transform:uppercase;
  color:var(--green-800);
  margin-bottom:2px;
}
.context__row small{
  display:block;
  font-size:11.5px;
  line-height:1.55;
  color:var(--muted);
}

/* Stylised map */
.map{
  position:relative;
  margin-top:16px;
  aspect-ratio:16/10;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  overflow:hidden;
  background-color:#DDE4D6;
  background-image:url('map.jpg');
  background-size:cover;
  background-position:center;
  box-shadow:var(--sh-xs);
}
.map::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(52,78,61,.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(52,78,61,.10) 1px, transparent 1px);
  background-size:26px 26px;
}
.map__pin{
  position:absolute;
  left:52%;top:48%;
  width:16px;height:16px;
  margin:-8px 0 0 -8px;
  border-radius:50%;
  background:var(--green-800);
  box-shadow:0 0 0 0 rgba(52,78,61,.45);
  animation:pinPulse 2.4s ease-out infinite;
}
@keyframes pinPulse{
  0%{box-shadow:0 0 0 0 rgba(52,78,61,.45);}
  70%{box-shadow:0 0 0 26px rgba(52,78,61,0);}
  100%{box-shadow:0 0 0 0 rgba(52,78,61,0);}
}
.map__label{
  position:absolute;
  left:52%;top:48%;
  transform:translate(-50%,-160%);
  padding:4px 10px;
  border-radius:var(--r-full);
  background:rgba(27,42,32,.85);
  color:#fff;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.6px;
  white-space:nowrap;
}
.map__caption{
  margin-top:8px;
  font-size:10.5px;
  font-style:italic;
  line-height:1.5;
  color:var(--muted);
}

/* ============================================================
   9. METHODOLOGY
   ============================================================ */
.method{
  display:grid;
  grid-template-columns:280px minmax(0,1fr);
  gap:clamp(16px,2.4vw,24px);
  align-items:start;
}

.method__nav{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.method__btn{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:13px 15px;
  text-align:left;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  background:var(--card);
  font-size:13px;
  font-weight:600;
  color:var(--ink);
  transition:background-color .22s var(--ease), border-color .22s var(--ease),
             color .22s var(--ease), transform .22s var(--ease-out),
             box-shadow .22s var(--ease);
}
.method__btn:hover{
  background:var(--sand-100);
  border-color:var(--green-300);
  transform:translateX(3px);
}
.method__btn.is-active{
  background:linear-gradient(150deg,var(--green-700),var(--green-900));
  border-color:var(--green-900);
  color:#fff;
  box-shadow:0 14px 28px -18px rgba(27,42,32,.95);
}
.method__icon{
  width:30px;height:30px;
  flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:9px;
  background:var(--sand-100);
  color:var(--green-700);
  font-size:14px;
  transition:background-color .22s var(--ease), color .22s var(--ease), transform .3s var(--ease-out);
}
.method__btn.is-active .method__icon{
  background:rgba(255,255,255,.18);
  color:#fff;
  transform:rotate(-8deg);
}

  border-radius:var(--r-md);
